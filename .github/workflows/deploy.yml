name: CI/CD Deploy to GCP Cloud Run

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test-and-lint:
    name: Lint & Test Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Nodejs_gemini-main

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './Nodejs_gemini-main/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Check
        run: npm run lint

      - name: Run Jest Test Suite
        run: npm test

  deploy:
    name: Deploy to GCP Cloud Run
    needs: test-and-lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Nodejs_gemini-main

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker Push to GCP Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build & Push Container Image
        run: |
          IMAGE_TAG="asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/ai-rag-wellness-assistant:${{ github.sha }}"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ai-rag-wellness-assistant
          region: asia-south1
          image: ${{ env.IMAGE_TAG }}
          flags: '--allow-unauthenticated --min-instances=0 --max-instances=2 --memory=512Mi'
          env_vars: |
            NODE_ENV=production
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Post-Deployment Health Check
        run: |
          SERVICE_URL=$(gcloud run services describe ai-rag-wellness-assistant --platform managed --region asia-south1 --format 'value(status.url)')
          echo "Deployed URL: $SERVICE_URL"
          curl --fail -s "$SERVICE_URL/api/health" || exit 1
