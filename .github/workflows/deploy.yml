name: CI/CD - AI RAG Wellness Assistant

# One workflow for PRs (lint & test) and main pushes (lint, test, build, deploy)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

defaults:
  run:
    working-directory: ./Nodejs_gemini-main

env:
  REGION: asia-south1
  SERVICE: ai-rag-wellness-assistant
  REGISTRY: asia-south1-docker.pkg.dev

jobs:
  # ── Job 1: Lint & Test ───────────────────────────────────────────────────────
  test-and-lint:
    name: Lint and Test Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ./Nodejs_gemini-main/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

  # ── Job 2: Deploy to GCP Cloud Run ───────────────────────────────────────────
  deploy:
    name: Deploy to GCP Cloud Run
    needs: test-and-lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Workload Identity / keyless auth

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build & Push Image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/api-rate-limiter/${{ env.SERVICE }}:${{ github.sha }}"
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --max-instances=2
            --memory=512Mi
          env_vars: |
            NODE_ENV=production
            GEMINI_MODEL=gemini-3.6-flash
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Health Check
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --platform managed --region ${{ env.REGION }} --format 'value(status.url)')
          echo "Deployed URL: $URL"
          curl --fail --silent "$URL/api/health"
